<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brute Decoder Pro - Copy & Download</title>
    <style>
        body { background: #000; color: #0f0; font-family: monospace; padding: 15px; }
        .box { border: 2px solid #0f0; padding: 20px; border-radius: 10px; background: #111; max-width: 600px; margin: auto; }
        textarea { width: 100%; height: 300px; background: #000; color: #0f0; border: 1px solid #0f0; margin-top: 15px; padding: 10px; border-radius: 5px; font-size: 12px; box-sizing: border-box; }
        button { background: #0f0; color: #000; border: none; padding: 12px; font-weight: bold; width: 100%; border-radius: 5px; cursor: pointer; margin-top: 10px; font-size: 14px; transition: 0.3s; }
        button:hover { background: #0c0; }
        .btn-group { display: flex; gap: 10px; }
        .copy-btn { background: #fff; color: #000; }
        .dl-btn { background: #008cff; color: #fff; }
        #status { color: yellow; margin-top: 10px; font-size: 13px; text-align: center; }
    </style>
</head>
<body>
    <div class="box">
        <h3>BRUTE-FORCE DECODER V2</h3>
        <p></p>
        <input type="file" id="fileInp" accept=".html">
        
        <button onclick="bruteCrack()">EXTRACT ORIGINAL CODE</button>
        
        <div id="status">Status: Waiting...</div>
        
        <textarea id="res" readonly placeholder=".."></textarea>
        
        <div class="btn-group">
            <button class="copy-btn" onclick="copyCode()">COPY CODE</button>
            <button class="dl-btn" onclick="downloadFile()"> DOWNLOAD HTML</button>
        </div>
    </div>

<script>
    let decodedData = "";

    function bruteCrack() {
        const file = document.getElementById('fileInp').files[0];
        const out = document.getElementById('res');
        const status = document.getElementById('status');
        if (!file) return alert("");

        status.innerText = "Status: Processing file...";
        const reader = new FileReader();
        reader.onload = function(e) {
            let content = e.target.result;
            
            try {
                let scriptMatch = content.match(/<script[\s\S]*?>([\s\S]*?)<\/script>/gi);
                if (!scriptMatch) {
                    status.innerText = "Status: No scripts found!";
                    return alert("");
                }

                let allScripts = scriptMatch.map(s => s.replace(/<\/?script.*?>/gi, "")).join("\n");

                let originalDocumentWrite = document.write;
                let originalEval = window.eval;
                let interceptedData = "";

                window.document.write = function(s) { interceptedData += s; };
                window.eval = function(s) { interceptedData += s; return s; };

                let tempScript = document.createElement('script');
                tempScript.text = allScripts;
                document.body.appendChild(tempScript);

                setTimeout(() => {
                    if (interceptedData) {
                        decodedData = interceptedData;
                    } else {
                        let varMatch = allScripts.match(/var\s+([^\s=]+)\s*=/);
                        if (varMatch) {
                            decodedData = window[varMatch[1]] || "Variable found but no text extracted.";
                        }
                    }
                    
                    out.value = decodedData;
                    status.innerText = decodedData ? "Status: Successfully Decoded! ✅" : "Status: Decoding Failed! ❌";
                    
                    window.document.write = originalDocumentWrite;
                    window.eval = originalEval;
                }, 600);

            } catch (err) {
                out.value = "Error: " + err.message;
                status.innerText = "Status: Error occurred!";
            }
        };
        reader.readAsText(file);
    }

    function copyCode() {
        const textArea = document.getElementById('res');
        if (!textArea.value) return alert("");
        
        textArea.select();
        textArea.setSelectionRange(0, 99999); // 
        document.execCommand('copy');
        
        alert("");
    }

    function downloadFile() {
        if (!decodedData) return alert("");
        
        const blob = new Blob([decodedData], { type: 'text/html' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'decoded_original.html';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
    }
</script>
</body>
</html>
